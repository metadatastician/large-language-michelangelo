# SPDX-License-Identifier: MPL-2.0
#
# The real gate for large-language-michelangelo. Every step here can fail;
# none is annotate-only — a check that cannot fail is worse than no check,
# because it reads as coverage.
#
# Every `uses:` is pinned to a full commit SHA: the org enforces
# sha_pinning_required, and a tag ref produces startup_failure at 0s — which
# reports as NO check rather than a red one.
#
# Code scanning is NOT here: it runs via GitHub code-scanning default setup.
# An advanced codeql.yml would conflict with default setup and fail
# permanently.

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: structural gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The licence split is two planes: MPL-2.0 on code (index.html, the
      # workflows, .a2ml metadata), CC-BY-SA-4.0 on prose (.adoc, .md).
      - name: SPDX split — MPL-2.0 code, CC-BY-SA-4.0 prose
        run: |
          set -euo pipefail
          fail=0
          n=0
          for f in ./*.html; do
            n=$((n+1))
            [ "$(head -1 "$f")" = "<!-- SPDX-License-Identifier: MPL-2.0 -->" ] \
              || { echo "::error file=$f::line 1 must be the MPL-2.0 SPDX comment"; fail=1; }
          done
          [ "$n" -ge 2 ] || { echo "::error::expected at least 2 root .html pages, saw $n — the glob matched nothing and this gate would be vacuous"; fail=1; }
          m=0
          for f in test/*.mjs; do
            m=$((m+1))
            [ "$(head -1 "$f")" = "// SPDX-License-Identifier: MPL-2.0" ] \
              || { echo "::error file=$f::line 1 must be the MPL-2.0 SPDX comment"; fail=1; }
          done
          [ "$m" -ge 2 ] || { echo "::error::expected at least 2 test sources, saw $m"; fail=1; }
          while IFS= read -r f; do
            [ "$(head -1 "$f")" = "// SPDX-License-Identifier: CC-BY-SA-4.0" ] \
              || { echo "::error file=$f::missing CC-BY-SA-4.0 SPDX header"; fail=1; }
          done < <(find . -name '*.adoc' -not -path './.git/*')
          while IFS= read -r f; do
            [ "$(head -1 "$f")" = "<!-- SPDX-License-Identifier: CC-BY-SA-4.0 -->" ] \
              || { echo "::error file=$f::missing CC-BY-SA-4.0 SPDX comment"; fail=1; }
          done < <(find . -name '*.md' -not -path './.git/*')
          while IFS= read -r f; do
            [ "$(head -1 "$f")" = "# SPDX-License-Identifier: MPL-2.0" ] \
              || { echo "::error file=$f::missing MPL-2.0 SPDX header"; fail=1; }
          done < <(find .github/workflows -name '*.yml')
          while IFS= read -r f; do
            head -3 "$f" | grep -q 'SPDX-License-Identifier:' \
              || { echo "::error file=$f::missing SPDX identifier"; fail=1; }
          done < <(find . -name '*.a2ml' -not -path './.git/*')
          [ "$fail" = 0 ]

      - name: Every page loads exactly one external script — pinned Three.js 0.160.0
        run: |
          set -euo pipefail
          fail=0
          seen=0
          for f in ./*.html; do
            seen=$((seen+1))
            n="$(grep -c '<script src=' "$f" || true)"
            [ "$n" = 1 ] || { echo "::error file=$f::expected exactly 1 external script tag, found $n"; fail=1; }
            grep -q 'src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"' "$f" \
              || { echo "::error file=$f::the external script is not the pinned Three.js 0.160.0 cdnjs UMD build"; fail=1; }
          done
          [ "$seen" -ge 2 ] || { echo "::error::glob matched $seen pages; this gate would be vacuous"; fail=1; }
          [ "$fail" = 0 ]
          echo "three.js pin intact across $seen pages"

      # The committed page is Artifact-shaped: the Claude Artifact host
      # supplies the document skeleton, and pages.yml prepends the doctype for
      # GitHub Pages. A committed doctype would double up on the artifact.
      - name: Every page stays Artifact-shaped (no doctype of its own)
        run: |
          set -euo pipefail
          fail=0
          seen=0
          for f in ./*.html; do
            seen=$((seen+1))
            if grep -qi '<!doctype' "$f"; then
              echo "::error file=$f::committed page must not carry a doctype; pages.yml prepends it at assemble time"
              fail=1
            fi
          done
          [ "$seen" -ge 2 ] || { echo "::error::glob matched $seen pages; this gate would be vacuous"; fail=1; }
          [ "$fail" = 0 ]
          echo "artifact-shaped across $seen pages"

      - name: Every action is pinned to a full commit SHA
        run: |
          set -euo pipefail
          if grep -rhoE 'uses: *[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[^ ]+' .github/workflows/ \
             | grep -vE '@[0-9a-f]{40}$'; then
            echo "::error::the above action refs are not pinned to a 40-character commit SHA"
            exit 1
          fi
          echo "all action refs are SHA-pinned"

      - name: No unsubstituted template placeholders
        run: |
          set -euo pipefail
          if grep -rlE '[{]{2}[A-Z][A-Z0-9_]*[}]{2}' --exclude-dir=.git . ; then
            echo "::error::the files above still contain template placeholders"
            exit 1
          fi
          echo "no template placeholders remain"

      # index.html and studio.html must each be a single self-contained file --
      # the Artifact sandbox cannot load a local .js -- so the engine is
      # duplicated between them. There is no bundler; this gate is what makes
      # the duplication safe, by making drift fail the build instead of going
      # unnoticed.
      - name: The shared engine is byte-identical in both pages
        run: |
          set -euo pipefail
          fail=0
          prev=""
          seen=0
          for f in ./*.html; do
            b="$(grep -c '===== BEGIN SHARED ENGINE =====' "$f" || true)"
            e="$(grep -c '===== END SHARED ENGINE =====' "$f" || true)"
            [ "$b" = 1 ] && [ "$e" = 1 ] || { echo "::error file=$f::expected exactly one BEGIN and one END SHARED ENGINE marker, found $b and $e"; fail=1; continue; }
            awk '/===== BEGIN SHARED ENGINE =====/{on=1;next} /===== END SHARED ENGINE =====/{on=0} on' "$f" > region.txt
            lines="$(wc -l < region.txt)"
            [ "$lines" -ge 100 ] || { echo "::error file=$f::shared engine region is only $lines lines — the markers moved and this gate would be vacuous"; fail=1; continue; }
            h="$(sha256sum < region.txt | cut -d' ' -f1)"
            echo "$f  $h  $lines lines"
            seen=$((seen+1))
            if [ -n "$prev" ] && [ "$h" != "$prev" ]; then
              echo "::error file=$f::shared engine has drifted from the other page — the regions must hash identically"
              fail=1
            fi
            prev="$h"
          done
          rm -f region.txt
          [ "$seen" -ge 2 ] || { echo "::error::compared $seen engine regions; this gate would be vacuous"; fail=1; }
          [ "$fail" = 0 ]

  determinism:
    name: determinism suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No actions/setup-node: ubuntu-latest already ships a Node with
      # node --test, and every additional `uses:` ref is another thing the
      # pin policy and any future actions.lock have to agree about.
      - name: Node version in use
        run: node --version

      # ROADMAP P-7 claims the build is deterministic. This is the measurement
      # behind that claim: the two pure regions of studio.html are linked and
      # run with no browser, and the resulting type/col/treeOrder/removeOrder
      # buffers are hashed against committed fixtures.
      - name: Golden determinism fixtures (P-7)
        run: node --test test/determinism.test.mjs
